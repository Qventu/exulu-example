version: '3.8'

services:
  exulu-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        NODE_ENV: ${NODE_ENV:-prod}
        NPM_TOKEN: ${NPM_TOKEN}
    container_name: exulu-backend
    ports:
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - ../files/vertex.json:/app/vertex.json
    environment:
      - NPM_TOKEN=${NPM_TOKEN}
      - NODE_ENV=${NODE_ENV:-prod}
      - PORT=9001
    # bwrap (used by @anthropic-ai/sandbox-runtime for skill sandboxing) needs
    # to create user namespaces. Docker's default seccomp profile AND the
    # default AppArmor profile on Ubuntu hosts both block the `unshare` and
    # `mount` syscalls bwrap relies on. We drop both filters so bwrap can run;
    # bwrap then enforces the actual sandbox.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    restart: unless-stopped